plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.uppyobjectembedder'
version = '0.1.0'

android {
  namespace "expo.modules.uppyobjectembedder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Image Embedder task from MediaPipe Tasks Vision (Google still labels this a "Solutions
  // Preview" — see the build brief's known risks). mobilenet_embedder.tflite in src/main/assets
  // is Google's own published MobileNetV3-Small embedder model for this task, merged into the
  // app's assets automatically as part of this library module.
  implementation "com.google.mediapipe:tasks-vision:1.0.0"
}
